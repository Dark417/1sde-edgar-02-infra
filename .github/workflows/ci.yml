name: ci

# Apply runs automatically on merge to main, but ONLY behind a re-plan that
# aborts on any destroy or replace (see the `apply` job). The reviewed plan on
# the PR is what authorises the merge; the guard is what stops a stale or
# drifted plan from doing damage between review and merge.
#
# workflow_dispatch is kept for out-of-band applies — drift correction, or
# re-running after a manual change — and still requires typing "apply".
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm you intend to change live infrastructure'
        required: true
        default: ""

permissions:
  contents: read
  id-token: write # OIDC federation to AWS
  pull-requests: write # to comment the plan

env:
  # Must be >= 1.10: the S3 backend uses use_lockfile, and an older binary
  # silently ignores it and runs with NO locking at all.
  TF_VERSION: "1.10.4"
  # Must match the Unity Catalog metastore's region (AGENTS.global.md law 11).
  AWS_REGION: us-east-2

  # Everything identifying is a SECRET, not a variable. This repo is public, so
  # its Actions logs are public — and GitHub masks secrets in log output while
  # variables appear verbatim. Both role ARNs and the state bucket name embed
  # the AWS account id, so `vars.` would republish exactly what the Tier-2
  # scrubbing removed from the tree.
  #
  # TF_VAR_* is the LOWEST-precedence source, which is why envs/dev.tfvars must
  # omit these rather than stub them — a placeholder there would silently win.
  TF_VAR_databricks_host: ${{ secrets.TF_VAR_DATABRICKS_HOST }}
  TF_VAR_warehouse_id: ${{ secrets.TF_VAR_WAREHOUSE_ID }}
  TF_VAR_allowed_account_ids: ${{ secrets.TF_VAR_ALLOWED_ACCOUNT_IDS }}
  TF_VAR_workspace_principal: ${{ secrets.TF_VAR_WORKSPACE_PRINCIPAL }}

jobs:
  static:
    name: fmt / validate / lint / security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (Tier-1/Tier-2 leak gate, root AGENTS.md)
        run: |
          # Tier-2 literals are deliberately not committed, so reconstruct them
          # from secrets — otherwise the scan silently skips those checks.
          cat > scripts/tier2.env <<EOF
          AWS_ACCOUNT_ID=${{ secrets.TIER2_AWS_ACCOUNT_ID }}
          METASTORE_ID=${{ secrets.TIER2_METASTORE_ID }}
          DBX_WORKSPACE_ID=${{ secrets.TIER2_DBX_WORKSPACE_ID }}
          WAREHOUSE_ID=${{ secrets.TIER2_WAREHOUSE_ID }}
          MEMBER_ROOT_EMAIL=${{ secrets.TIER2_MEMBER_ROOT_EMAIL }}
          EOF
          bash scripts/secret-scan.sh

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # No backend: validate must not need credentials or a state file.
      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: tflint --recursive

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: false

  gates:
    name: forbidden-resource gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scoped to Terraform sources, and comment lines are excluded: the repo
      # explains in prose why each of these is forbidden, and a gate that fires
      # on its own rationale would push the explanation out of the codebase.
      # An inline comment after real code still matches, which is correct.
      - name: No account-level Unity Catalog resources
        run: |
          hits=$(grep -rEn 'databricks_(metastore|mws_|account_)' --include='*.tf' . \
                 | grep -vE ':[0-9]+:[[:space:]]*(#|//)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Free Edition exposes no account-level API (rule 1, design doc 4.1)."
            exit 1
          fi

      - name: No cross-repo state coupling
        run: |
          hits=$(grep -rEn 'terraform_remote_state' --include='*.tf' . \
                 | grep -vE ':[0-9]+:[[:space:]]*(#|//)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Use SSM parameters, not remote state (rule 2)."
            exit 1
          fi

      - name: Tables belong to Liquibase, not Terraform
        run: |
          hits=$(grep -rEn 'databricks_sql_table' --include='*.tf' . \
                 | grep -vE ':[0-9]+:[[:space:]]*(#|//)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Table lifecycle is owned by repo 1 Liquibase (rule 3)."
            exit 1
          fi

  tests:
    name: names match contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Federate as this repo's OIDC role. It carries only wheel read plus the
      # right to assume the Terraform role — provisioning rights are never
      # attached to the CI identity itself.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # pip cannot read s3:// URLs, so the wheel is fetched first (AGENTS.md 9.4).
      - name: Fetch the contracts wheel
        run: |
          aws s3 cp "s3://${{ secrets.TF_STATE_BUCKET }}/wheels/" /tmp/wheels/ --recursive
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt --find-links /tmp/wheels/

      - name: pytest
        run: pytest tests/ -v

  plan:
    name: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [static, gates, tests]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Chain into the Terraform role, which is where provisioning rights live.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      # -var 'aws_profile=' overrides the local-developer profile in dev.tfvars.
      # CI authenticates by OIDC and has no AWS profiles configured.
      - name: terraform plan
        run: |
          terraform plan -var-file=envs/dev.tfvars -var 'aws_profile=' \
            -no-color -out=tf.plan | tee plan.txt

      - name: Refuse plans containing destroy actions
        run: |
          if grep -qE '^\s*# .* (will be destroyed|must be replaced)' plan.txt; then
            echo "::error::Plan contains destroy or replace actions. Review by hand."
            exit 1
          fi

      - name: Comment the plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('plan.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### terraform plan\n```\n' + body + '\n```',
            });

  apply:
    name: apply
    # Automatic on merge to main; manual dispatch still requires typing "apply".
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'apply')
    runs-on: ubuntu-latest
    needs: [static, gates, tests]
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      # Re-plan rather than trusting the PR's artifact. The plan reviewed on the
      # PR authorised the merge, but state can move between review and merge —
      # another apply, a console change, a drifted resource. This plan is the
      # one that actually runs.
      - name: terraform plan
        run: |
          terraform plan -var-file=envs/dev.tfvars -var 'aws_profile=' \
            -no-color -out=tf.plan | tee plan.txt

      # The guard that makes auto-apply safe. A destroy here means dropping a
      # catalog Liquibase built 13 tables inside, so the job stops and waits for
      # a human rather than converging.
      - name: Abort on destroy or replace
        run: |
          if grep -qE '^\s*# .* (will be destroyed|must be replaced)' plan.txt; then
            echo "::error::Plan would destroy or replace a resource. Auto-apply refuses; review, then run workflow_dispatch."
            exit 1
          fi

      - name: terraform apply
        run: terraform apply -no-color tf.plan
